  # RTS ABI width checks (gib_vector_slice lower bound).  Vectorization is not
  # involved, so these run in the two widths only.
  # NOTE: all four VfyAbi* tests pass "--optc \" -O3 \"" to DISABLE -flto.
  # This is load-bearing, not incidental.  Gibbon's default optc is
  # " -O3  -flto " (Common.hs:317), and LTO lets GCC re-resolve the mismatched
  # RTS prototypes and inline them away, which MASKS the ABI defect entirely --
  # on the pre-fix tree all four of these PASS under the default flags.  Without
  # -flto the compiler emits a real call, a 32-bit GibInt is written to %edi and
  # zero-extends into the %rdi the 64-bit RTS reads, and the bug appears.
  # Remove these flags and these tests stop being able to catch a regression.
  # Arithmetic-intensity sweep: six MayVectorize maps over the SAME list with
  # identical memory traffic (2 Int fields in, 2 out) and 0/1/2/4/8/16 fused
  # multiply-adds per element.  Memory traffic is constant by construction, so
  # the vectorized/scalar ratio across passes isolates arithmetic intensity.
  # mapAI8/mapAI16 exceed 32 bits, so int32 gets its own answer file; the two
  # differing fields are exact two's-complement truncations of the 64-bit ones
  # (trunc32(348410813312)=518462336, trunc32(6906862201810515840)=326956928).
  # Arithmetic-intensity sweep v2.  Multiplier arrives as a PARAMETER (odd,
  # runtime-derived) so GCC cannot strength-reduce it -- v1 used compile-time
  # constants and therefore emitted zero packed multiplies.  mapSer<N> is a
  # serial chain (latency ceiling), mapPar<N> is N independent products
  # (throughput ceiling); memory traffic is identical across all ten passes.
  # Only mapSer16 exceeds 32 bits at n=64: trunc32(322021484374432)=2016389536.
  - name: MapIntensityV2.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/MapIntensityV2.ans
    source-replacements:
      - {from: "10000000", to: "64"}
    run-modes: [gibbon2, vectorize]

  # Regression test for a fixed vectorizer crash: a loop-invariant that depends
  # on another loop-invariant used to hoist a dangling reference out of the loop
  # ("Var loop_mut_<n>_buf1_anf0 not found", L3/Typecheck.hs:1157).  The
  # dependency bindings are now hoisted alongside it, in ANF, under fresh names.
  # This must PASS in all four modes; it fails on any compiler predating the fix.
  - name: VecInvariantChain.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/VecInvariantChain.ans
    run-modes: [gibbon2, vectorize]

  - name: MapIntensity.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/MapIntensity.ans
    source-replacements:
      - {from: "10000000", to: "64"}
    run-modes: [gibbon2, vectorize]

  - name: VfyAbiNegSlice.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/VfyAbiNegSlice.ans
    run-modes: [gibbon2]
    test-flags: ["--optc", " -O3 "]

