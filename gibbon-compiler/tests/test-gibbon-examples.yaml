  ## Optimization regression tests added for loopification/vectorization work.
  ## These compare optimized output against a vanilla packed baseline, with
  ## timing lines ignored by TestRunner.

  # Small vectorization-focused examples.  These are intentionally tiny so
  # they are valid in both 64-bit and 32-bit integer modes.
  - name: VectorListMap.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorListMap.ans
    compare-with-baseline: true
    baseline-dir: examples/vectorization/AOS
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorTreeMap.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorTreeMap.ans
    compare-with-baseline: true
    baseline-dir: examples/vectorization/AOS
    run-modes: [gibbon2, loopify, selective, vectorize]

  # True four-lane Int32 SIMD over genuinely fully factored (SoA) buffers.
  # Int32 is 4 bytes, so one 128-bit SSE2 register holds FOUR elements and one
  # 16-byte load/store moves four of them -- half the bytes per element that
  # the 2-lane Int64 path moves.  Add/Sub/Select exercise the packed
  # _mm_add_epi32 / _mm_sub_epi32 / _mm_cmpeq_epi32 + bitwise-select helpers;
  # element counts are deliberately not multiples of four so the scalar tail
  # runs too.  MulScalar/DivScalar are CONTROLS: SSE2 has no packed signed
  # 32-bit multiply (that is SSE4.1), divide or modulus, so those loops must
  # stay entirely scalar rather than call a helper that spills lanes.
  # Conversion is a control for the fallback policy: an explicit width
  # conversion in the loop body keeps the whole loop scalar.
  - name: VectorInt32Add.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32Add.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt32Sub.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32Sub.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt32Select.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32Select.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt32Boundary.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32Boundary.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt32MulScalar.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32MulScalar.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt32DivScalar.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32DivScalar.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt32Conversion.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32Conversion.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # True eight-lane Int16 and sixteen-lane Int8 SIMD over genuinely fully
  # factored (SoA) buffers.  A 128-bit SSE2 register holds 8 Int16s or 16
  # Int8s, so one 16-byte load/store moves that many elements -- 4x and 8x
  # fewer bytes per element than the 2-lane Int64 path.  Add/Sub/Select use
  # _mm_add_epi16/_mm_sub_epi16/_mm_cmpeq_epi16 and the epi8 equivalents;
  # Int16 multiply additionally uses _mm_mullo_epi16, which IS baseline SSE2
  # (unlike _mm_mullo_epi32).  Element counts are deliberately not multiples
  # of the lane count so the scalar tail runs too.
  #
  # The *Scalar entries are CONTROLS for operations SSE2 cannot do packed:
  # Int16 divide/modulus and Int8 multiply must leave their loop scalar
  # rather than call a helper that spills lanes.
  - name: VectorInt16Add.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt16Add.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

