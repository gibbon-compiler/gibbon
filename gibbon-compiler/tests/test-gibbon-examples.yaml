  ## VW-23 regressions (Phase 7 step 4).  Correctness-only; not benchmarks.
  ## Both printed the wrong value in every --use-mutable-cursors mode
  ## (loopify/selective/vectorize) while plain --packed was correct, and both
  ## were masked until VW-03 repaired the output oracle.  Answers come from
  ## Racket via `make answers`, so the expected value is independent of Gibbon.
  ## test31 covers a tail-recursive fold whose list element carries a packed
  ## field, so the tail is reached through a random-access node (it printed 1
  ## instead of 2).  test32 covers a timed packed build whose argument is a
  ## nullary primitive, which used to erase Cursorize's mutable-location
  ## environments (it printed 0 instead of 12).
  - name: test31_absran_tailfold.gib
  - name: test32_timed_build_sizeparam.gib

  ## VW-04 regression (Phase 7 step 5).  Correctness-only; not a benchmark.
  ## Reads the first and last element of a generated vector at each of the
  ## lengths once reported as corrupting the heap (1, 8, 16, 17, 24, 32).  The
  ## answer 2020 is derived by hand from (n-1)^2, not recorded from Gibbon.
  ## Deterministic rejection of INVALID indices is covered separately, by
  ## gibbon-rts/tests/run_vector_bounds_tests.sh, because it needs the RTS
  ## built with -D_GIBBON_BOUNDSCHECK.
  - name: test33_vector_index_lengths.hs
    answer-file: examples/test33_vector_index_lengths.ans

  ## VW-31 regression (Phase 7 step 8.1a).  A let-bound recursive packed tail
  ## consumed by two constructor alternatives.  Before the fix this compiled
  ## silently and produced a corrupt value in every mode, at plain --packed,
  ## in both layouts.  test35 is the one-constructor control, which always
  ## worked and is registered so the repair cannot be "stop reordering".
  ## Both answers are derived from the source definition, not recorded from
  ## Gibbon.
  - name: test34_vw31_shared_tail.hs
    answer-file: examples/test34_vw31_shared_tail.ans
  - name: test35_vw31_shared_tail_onector.hs
