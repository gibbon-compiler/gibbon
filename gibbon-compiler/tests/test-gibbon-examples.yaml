  ## Optimization regression tests added for loopification/vectorization work.
  ## These compare optimized output against a vanilla packed baseline, with
  ## timing lines ignored by TestRunner.

  # Small vectorization-focused examples.  These are intentionally tiny so
  # they are valid in both 64-bit and 32-bit integer modes.
  - name: VectorListMap.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorListMap.ans
    compare-with-baseline: true
    baseline-dir: examples/vectorization/AOS
    run-modes: [gibbon2, int32, loopify, selective, vectorize, int32-vectorize]

  - name: VectorTreeMap.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorTreeMap.ans
    compare-with-baseline: true
    baseline-dir: examples/vectorization/AOS
    run-modes: [gibbon2, int32, loopify, selective, vectorize, int32-vectorize]

  # Existing fully factored SoA benchmark programs, compared against their
  # matching flat AoS sources when one exists.
  - name: ColorOctree.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/ColorOctree.ans
    source-replacements:
      - {from: "100000000", to: "64"}
      - {from: "10000000", to: "64"}
      - {from: "1000000", to: "64"}
      - {from: "100000", to: "64"}
