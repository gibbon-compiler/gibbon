  ## ---------------------------------------------------------------------
  ## Historical int32 / int32-vectorize reproducers (ARCHIVED).
  ##
  ## The `--int32` compiler flag and the `int32`/`int32-vectorize` harness
  ## modes these were written for no longer exist (see the "Explicit-width
  ## coverage" section near the end of this file for their replacement).  The
  ## tests below use bare `Int` and now just run as ordinary 64-bit programs
  ## under `run-modes: [gibbon2, vectorize]`; the `.int32.ans` sibling-answer
  ## mechanism they were built around is inert (no active mode's name can
  ## produce that infix anymore).
  ##
  ## Answers were verified against an independent model of each program (not
  ## merely recorded from a run).

  # Vectorized int32 arithmetic: element counts that are not a multiple of the
  # 4-wide stride, so both the vector body and the scalar tail run.
  - name: Int32VecCounts.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/Int32VecCounts.ans
    source-replacements:
      - {from: "n0 = sizeParam", to: "n0 = 1003"}
    run-modes: [gibbon2, vectorize]

  # MUL / DIV / MOD int32x4 helpers on negative operands.
  - name: Int32VecArith.hs
    dir: examples/soa_examples/programs/SOA
