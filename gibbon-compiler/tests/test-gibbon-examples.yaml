    run-modes: [gibbon2, loopify, selective, vectorize]

  ## Guarded control flow through SoA loopification (Phase 6 step 2).
  ##
  ## `LoopifyTraversals.anfScalarExpr` used to return the condition's, the
  ## then-arm's and the else-arm's ANF bindings CONCATENATED to a caller that
  ## spliced them above the `IfE`, so both arms ran unconditionally.  A guarded
  ## division was therefore evaluated for the very elements its guard excluded:
  ## gibbon2 printed the right answer while loopify/selective/vectorize divided
  ## by zero.  Every answer below was checked against an independently written
  ## Integer oracle, and each program contains an element that makes the
  ## unselected arm divide by zero -- so a regression aborts rather than
  ## quietly changing a number.

  # The minimal reproducer at all four widths: `if d == 0 then 7 else 100 / d`
  # over a fully factored list whose elements include 0.
  ## Scoped `LetE` in loopifiable scalar computations (Phase 6 step 3).
  ##
  ## A conditional arm holding more than one operation is flattened into a
  ## `let` inside that arm, and the loopifier's scalar-expression grammar used
  ## to reject `LetE` outright -- so nested guards, multi-operation arms and
  ## guarded partial operations behind a let were never loopified at all, and
  ## stayed scalar with no diagnostic.  These programs are the previously
  ## unreachable shapes; each was confirmed to reach a real loopified loop from
  ## `chunk_count`/`ForE` markers, not merely to produce the right number.
  ## Answers come from an independently written Integer oracle.

  # A multi-operation arm: `if p then x + 1 else (x * 3) + 2`.
  - name: ScalarLetMultiOpArmInt8.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/ScalarLetMultiOpArmInt8.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

