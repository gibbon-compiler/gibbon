    run-modes: [gibbon2, loopify, selective, vectorize]

  # Mixed-width genuine SoA: one traversal over a Factored datatype carrying
  # all four integer widths.  Loopification emits one loop per field buffer and
  # each is vectorized at its own optimal stride (W8 16, W16 8, W32 4, W64 4),
  # so every field cursor advances exactly stride * scalarBytes and no field
  # runs into a neighbouring buffer.
  - name: VectorMixedWidths.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorMixedWidths.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Unsupported-operation ISOLATION: an Int32 multiply (no packed SSE2 form)
  # sits beside an Int8 add, an Int16 multiply and an Int64 add.  Only the
  # Int32 buffer's loop falls back to scalar; the other three still vectorize.
  - name: VectorMixedFallback.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorMixedFallback.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # All five SIGNED comparisons (== < > <= >=) plus mask-select, packed at
  # W8/W16/W32 on baseline SSE2.  _mm_cmpgt_epi{8,16,32} is the only packed
  # signed compare SSE2 offers, so < swaps operands and <=/>= complement the
  # mask with an XOR against all-ones (itself produced by comparing a register
  # with itself).  The data deliberately contains negatives: an unsigned
  # comparison would give a different total, so these pin SIGNED semantics.
  - name: VectorInt8Cmp.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt8Cmp.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt16Cmp.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt16Cmp.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt32Cmp.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32Cmp.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # W8 comparisons over enough elements to cross several packed-region chunks.
  - name: VectorInt8CmpBig.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt8CmpBig.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Packed multiply at W32 and W8, both emulated on baseline SSE2 and both
  # measurably faster than the scalar loop, so both are enabled.  W32 uses two
  # _mm_mul_epu32 plus shuffles (the low 32 bits of a signed product equal
  # those of the unsigned product); W8 unpacks to 16-bit lanes, uses
  # _mm_mullo_epi16, masks to the low 8 bits and repacks.  Values stay inside
  # each width's signed range, so no result depends on overflow policy.
  - name: VectorInt32Mul.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt32Mul.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  - name: VectorInt8Mul.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorInt8Mul.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Ordered comparisons across all four widths in one Factored structure.
  # W8/W16/W32 vectorize independently; the W64 field's ordered comparison
  # stays SCALAR (SSE2 has no packed signed 64-bit compare) and must not
  # disable the three narrow fields.
  - name: VectorMixedCmp.hs
    dir: examples/vectorization/SOA
    answer-file: examples/vectorization/VectorMixedCmp.ans
    run-modes: [gibbon2, loopify, selective, vectorize]


