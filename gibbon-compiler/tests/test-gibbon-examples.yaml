  ## ---------------------------------------------------------------------
  ## Explicit-width coverage.  The `--int32` compiler flag has been removed:
  ## bare `Int` is unconditionally W64, and a 32-bit value requires writing
  ## `Int32` in the source.  These programs declare Int32 (and, where noted,
  ## other narrow widths) directly in their data/type declarations, unlike
  ## the older "Int32*"/"VecProbe*" family above, which uses bare `Int` and
  ## relied on the now-removed flag to make it 32-bit -- those still run
  ## (as ordinary 64-bit programs now) but no longer exercise any narrow
  ## width. Answers were verified against the executed output, not merely
  ## recorded from one run.

  # Int8/Int16/Int32/Int64 fields in one packed AoS constructor: boundary
  # literals at both Int8 and Int32, homogeneous per-width arithmetic, an
  # Int8 comparison, manual per-field printing, and the generated
  # (printPacked) datatype printer.
  #
  # Previously gibbon2-only, because a discarded `printPacked` call was
  # silently deleted whenever `--use-mutable-cursors` was on (which every
  # non-base mode sets). That was a Cursorize effect-dropping bug, now fixed
  # (see 'unitizePackedMutableResult'), so this runs in all four modes.
  - name: ExplicitMixedWidths.hs
    dir: examples/soa_examples/programs/AOS
    answer-file: examples/soa_examples/reduced_answers/ExplicitMixedWidths.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Recursive packed AoS structure (Int8 alongside Int32): packed
  # constructor copy/traversal, the generated datatype printer, and
  # homogeneous Int32 arithmetic reduced across the recursion.
  #
  # Was gibbon2-only for the same (now fixed) print-dropping reason as
  # ExplicitMixedWidths.hs above.
  - name: ExplicitInt8Int32Chain.hs
    dir: examples/soa_examples/programs/AOS
    answer-file: examples/soa_examples/reduced_answers/ExplicitInt8Int32Chain.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Effect COUNT and ORDER for discarded printPacked calls: two tree prints
  # separated by an interleaved printint, plus a third from inside an
  # ordinary helper, covering both the `_` binder and a named-but-unused
  # binder. A dropped, duplicated, or reordered effect all change the text.
  - name: PrintPackedEffects.hs
    dir: examples/soa_examples/programs/AOS
    answer-file: examples/soa_examples/reduced_answers/PrintPackedEffects.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Single evaluation of a non-trivial expression whose product fields are
  # projected during cursorization.  Under --use-mutable-cursors a let-bound
  # call returning a non-empty tuple was rebuilt as (proj 0 call, .., proj n
  # call), so the call ran once per field: effects were duplicated and, because
  # mutable cursors advance in place, the answers were wrong.  Each traversal
  # here prints one digit per leaf as well as returning a value, and the file
  # also carries MkProdE / LetE / IfE / VarE control shapes, so a duplicated,
  # dropped, or reordered evaluation changes the expected text.
  - name: TupleTraversalEffects.hs
    dir: examples/soa_examples/programs/AOS
    answer-file: examples/soa_examples/reduced_answers/TupleTraversalEffects.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Explicit integer-width conversions (toInt8/toInt16/toInt32/toInt64) in a
  # mixed-width AoS traversal: the specification's named boundary values, a
  # conversion feeding a comparison and then arithmetic, conversions into
  # constructor fields and out of a case, and a recursive traversal over narrow
  # fields.  Conversion is truncating two's-complement, so a saturating or
  # sign-losing implementation changes the text.
  - name: ExplicitConversions.hs
    dir: examples/soa_examples/programs/AOS
    answer-file: examples/soa_examples/reduced_answers/ExplicitConversions.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # The same conversions inside a genuinely fully factored (SoA) datatype with
  # narrow Int8 and Int32 fields, verified against the generated C's cursor
  # array rather than the filename.
  - name: FactoredConversions.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/FactoredConversions.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Genuinely fully factored (SoA) structure with an explicit Int8 field
  # alongside an explicit Int32 field: packed constructor copy/traversal,
  # arithmetic reduced across the recursion, and the generated datatype
  # printer.  This used to be a minimized reproduction of a real bug (a
  # narrow SoA scalar field misclassified in InferLocations' SoA argument-
  # size analysis, routing it into Cursorize's unimplemented
  # AfterVariableLE narrow-width path instead of the working
  # AfterConstantLE one -- see InferLocations.hs, the SoA case of
  # 'argSizeForDataCon'-adjacent classification, and the milestone
  # handoff), now fixed. gibbon2-only, not the usual four: its printPacked
  # call is silently dropped under loopification (the known, unrelated,
  # separately-tracked DCE bug -- see ExplicitMixedWidths.hs above);
  # Now runs in all four modes: the print-dropping bug that forced
  # gibbon2-only here has been fixed in Cursorize.
  - name: ExplicitNarrowFactored.hs
    dir: examples/soa_examples/programs/SOA
    answer-file: examples/soa_examples/reduced_answers/ExplicitNarrowFactored.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # The same genuine-SoA coverage, across all four active modes: Int16 (a
  # different narrow width than the one above) alongside an Int64 control
  # field, negative narrow values, Int16 boundary values (INT16_MIN and
  # INT16_MAX), and a comparison on a field extracted from the factored
  # structure.  Correctness is observable through the returned sum and
  # comparison result, not a printPacked call, so it is unaffected by the
  # loopification DCE bug and can genuinely exercise all four modes.
  ## Deterministic integer arithmetic (Phase 6).  Signed two's-complement
  ## modular semantics for +, -, * and ^; C-style truncating division and
  ## dividend-signed remainder, with MIN / -1, MIN % -1 and a zero divisor all
  ## pinned instead of left to C's undefined behaviour.  Every answer below was
  ## checked against an independently written Integer oracle, not recorded from
  ## a run, and each was confirmed identical under GCC and Clang at -O0, -O2
  ## and -O3.

  # Wraparound for +, - and * at all four widths: MAX+1, MIN-1, 1-MIN,
  # MIN * -1, MAX * 2, MAX*MAX, MIN*MIN and both mixed signs.  Every one of
  # these was UNDEFINED BEHAVIOUR in the emitted C before this milestone,
  # while the packed SIMD helper for the same operation wrapped -- so the two
  # halves of one loop were not specified to agree.
  - name: ArithWrapWidths.hs
    dir: examples/soa_examples/programs/AOS
    answer-file: examples/soa_examples/reduced_answers/ArithWrapWidths.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Division and remainder: the eight-row sign matrix at all four widths
  # (truncating toward zero, remainder taking the dividend's sign -- NOT
  # Haskell's flooring div/mod), plus MIN / -1 and MIN % -1, which C leaves
  # undefined and which raise SIGFPE on x86-64 rather than returning.
  - name: ArithDivEdge.hs
    dir: examples/soa_examples/programs/AOS
    answer-file: examples/soa_examples/reduced_answers/ArithDivEdge.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Exponentiation at all four widths, by modular squaring at the annotated
  # width.  The helper this replaced carried no width, special-cased base 2 as
  # an `int` shift (so 2^31 came back as -2147483648 and 2^40 as 256), and
  # looped `pow` times multiplying signed values.  Covers 0^0, negative
  # exponents, and bases that wrap repeatedly.
  - name: ArithExpWidths.hs
    dir: examples/soa_examples/programs/AOS
    answer-file: examples/soa_examples/reduced_answers/ArithExpWidths.ans
    run-modes: [gibbon2, loopify, selective, vectorize]

  # Deliberately OVERFLOWING arithmetic inside a vectorized, genuinely
  # fully-factored (SoA) traversal, one program per narrow width.  The element
  # count (37) is not a multiple of any lane count, so a vectorized body and a
  # scalar tail must produce bit-identical results on wrapping values.  The
  # accumulator is Int64 and values are widened into it, so no second overflow
  # can mask the one under test.
  # Constant operands versus runtime operands, all six primitives at all four
  # widths.  There is no constant folder today, so both halves reach the same
  # helper; the pairs exist so that the day one is added, evaluating
