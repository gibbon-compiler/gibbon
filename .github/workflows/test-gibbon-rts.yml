name: Test Gibbon RTS

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always
  # The C RTS is LLVM bitcode because its Clang build uses -flto. Use Clang
  # for Rust's final link and enable LTO so the linker loads that bitcode.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  RUSTFLAGS: -C link-arg=-flto

jobs:
  build_and_test:
    name: test-gibbon-rts
    runs-on: ubuntu-24.04
    steps:
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libgmp-dev uthash-dev clang llvm
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: checkout
        uses: actions/checkout@v3
      - name: build and test
        run: |
          export GIBBONDIR=`pwd`
          cd gibbon-rts/
          make all
          cargo build -v
          cargo test gc_tests1 -- --nocapture --test-threads 1

      - name: build and test (no eager promotion)
        run: |
          export GIBBONDIR=`pwd`
          cd gibbon-rts/
          make clean
          make GCSTATS=1 EAGER_PROMOTION=0
          cargo build -v
          cargo test gc_tests2 -- --nocapture --test-threads 1
