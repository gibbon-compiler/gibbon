name: Test Gibbon RTS

on:
  - push
  - pull_request

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc # we use gcc's lto on the C side, so the rust side has to use gcc's linker as well (default Rust linker would go nuts)

jobs:
  build_and_test:
    name: test-gibbon-rts
    runs-on: ubuntu-24.04
    steps:
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev libgmp-dev uthash-dev gcc-11
          sudo unlink /usr/bin/gcc && sudo ln -s /usr/bin/gcc-11 /usr/bin/gcc
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: checkout
        uses: actions/checkout@v3
      - name: build and test
        run: |
          export GIBBONDIR=`pwd`
          cd gibbon-rts/
          make all
          cargo build -v
          cargo test gc_tests1 -- --nocapture --test-threads 1

      - name: build and test (no eager promotion)
        run: |
          export GIBBONDIR=`pwd`
          cd gibbon-rts/
          make clean
          make GCSTATS=1 EAGER_PROMOTION=0
          cargo build -v
          cargo test gc_tests2 -- --nocapture --test-threads 1
