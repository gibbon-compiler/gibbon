name: "Test our Nix setup"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
    - uses: cachix/cachix-action@v15
      with:
        name: opencilk
    - uses: rrbutani/use-nix-shell-action@v1
      with:
        file: shell.nix
    - run: cabal update
    - run: cabal build exe:gibbon
    - run: cabal test gibbon --test-show-details=direct
    # Smoke test: end-to-end build + run of a parallel example, proving the
    # OpenCilk wiring (Compiler.hs + gibbon-rts/Makefile + opencilk-clang
    # from the nix shell) holds together. Addresses @ulysses4ever's review
    # comment on PR #311 ("it'd be really nice to have a way to test opencilk").
    - name: parallel smoke test (OpenCilk)
      run: |
        export GIBBONDIR=`pwd`
        mkdir -p gibbon-compiler/examples/build_tmp
        cabal v2-exec gibbon -- --parallel --cc=clang \
          --cfile=gibbon-compiler/examples/build_tmp/BinTree_par.c \
          --exefile=gibbon-compiler/examples/build_tmp/BinTree_par.exe \
          gibbon-compiler/examples/parallel/BinTree.hs
        # Args are <sizeParam> <iters>; keep both small for CI.
        gibbon-compiler/examples/build_tmp/BinTree_par.exe 10 1
